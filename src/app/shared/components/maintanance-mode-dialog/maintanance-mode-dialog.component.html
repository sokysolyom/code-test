<div mat-dialog-content class="flex flex-row maintanance-mode-dialog-text-box">
  <div class="flex flex-row justify-start items-center">
    <mat-icon color="primary" class="ng-icons">warning</mat-icon>
    <h2 class="maintanance-mode-dialog-warning-text ml-[16px]">Upozornenie</h2>
  </div>
  <div class="flex flex-col maintanance-mode-dialog-inner-text-box">
    <p>Prebieha údržba stránky, prosím skúste to neskôr. Ďakujeme za pochopenie.
    </p>
  </div>
</div>
<div class="flex justify-end items-end" mat-dialog-actions>
  <button (click)="onClose()" mat-raised-button color="accent" mat-dialog-close>Rozumiem!</button>
</div>
