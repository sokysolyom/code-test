<div class="app-background">
  <div class="flex flex-col introduction-picture-box">

    <!-- Annual event -->
    <div class="flex flex-row animation-from-top">
      <span *ngIf="introductionData.header.annual" class="introduction-year"
        [innerHtml]="introductionData.header.annual"></span>
    </div>

    <!-- Event title -->
    <div class="flex flex-col animation-from-top">
      <span *ngIf="introductionData.header.titleBig" class="introduction-main-title"
        [innerHtml]="introductionData.header.titleBig"></span>
      <span *ngIf="introductionData.header.titleSmall" class="introduction-sub-title pb-[16px]"
        [innerHtml]="introductionData.header.titleSmall"></span>
    </div>

    <!-- Event hashtag -->
    <div class="pb-[25px]" class="animation-from-top">
      <span *ngIf="introductionData.header.hashtag" class="introduction-hashtag"
        [innerHtml]="introductionData.header.hashtag"></span>
    </div>

    <!-- Event date and place -->
    <div class="introduction-date-drop-animation">
      <ul class="introduction-mini-info">
        <li *ngIf="introductionData.header.date" class="introduction-mini-info-text"
          [innerHtml]="introductionData.header.date"></li>
        <li *ngIf="introductionData.header.place" class="introduction-mini-info-text"
          [innerHtml]="introductionData.header.place"></li>
      </ul>
    </div>

    <!-- Event registration button and calendar button -->
    <div class="flex flex-row lt-sm:flex-col introduction-button-drop-animation mb-[30px]">
      <button [disabled]="isRegistratDisabled" [ngClass]="{'introduction-disable': isRegistratDisabled}"
        mat-raised-button type="submit" class="!text-base !rounded introduction-button-secondary-color"
        (click)="participate()">
        <mat-icon>login</mat-icon>
        <span>Registrovať sa</span>
      </button>
      <div class="introduction-calendar-box">
        <button mat-button class="!rounded !text-base !bg-transparent introduction-button-no-bg"
          [matMenuTriggerFor]="calendarMenu">
          <mat-icon>event_available</mat-icon>
          <span>Pridať do kalendára</span>
        </button>
        <!-- https://parcel.io/tools/calendar -->
        <mat-menu #calendarMenu="matMenu">
          <a mat-menu-item class="flex-row gap-10 justify-left items-center content-center"
            href="https://calendar.google.com/calendar/render?action=TEMPLATE&dates=20250522%2F20250524&details=V%C3%A1%C5%BEen%C3%A9%20kolegyne%2C%20v%C3%A1%C5%BEen%C3%AD%20kolegovia%2C%0A%0Aje%20n%C3%A1m%20pote%C5%A1en%C3%ADm%20V%C3%A1s%20pozva%C5%A5%20na%C2%A0v%20porad%C3%AD%20u%C5%BE%20XXXI.%20ro%C4%8Dn%C3%ADk%C2%A0vedecko-odborn%C3%A9ho%20podujatia%20s%0An%C3%A1zvom%C2%A0Slovensko-%C4%8Cesk%C3%A1%C2%A0konferencia%20o%20hemost%C3%A1ze%20a%20tromb%C3%B3ze.%C2%A0%0APodujatie%20sa%20uskuto%C4%8Dn%C3%AD%20v%20d%C5%88och%C2%A022.%C2%A0%E2%80%93%C2%A023.%20m%C3%A1ja%202025%20v%20priestoroch%C2%A0Aula%20Magna%2C%0AJesseniovej%20lek%C3%A1rskej%20fakulta%20Univerzity%20Komensk%C3%A9ho%20v%C2%A0Martine.%0ATe%C5%A1%C3%ADme%20sa%20na%20Va%C5%A1u%20%C3%BA%C4%8Das%C5%A5%21%0A%0Aprof.%20MUDr.%20J%C3%A1n%20Sta%C5%A1ko%2C%20PhD.%2C%20prezident%20podujatia%20%C3%A1no%0Aprof.%20MUDr.%20Pavel%20%C5%BD%C3%A1k%2C%20Ph.D.%2C%20prezident%20podujatia&location=Mal%C3%A1%20hora%204%2FA%2C%20036%2001%20Martin&text=Slovensko-%C4%8Cesk%C3%A1%20konferencia%20o%20hemost%C3%A1ze%20a%20tromb%C3%B3ze%20s%20medzin%C3%A1rodnou%20%C3%BA%C4%8Das%C5%A5ou"

<div class="flex flex-col main-content">
  <div class="flex-row flex justify-center">
    <div class="flex-col max-w-[60%] lt-md:max-w-[90%] gap-40">

      <!-- Quote -->
      <div *ngIf="introductionData.quote" class="flex justify-center items-center introduction-motto-box"
        [innerHtml]="introductionData.quote">
      </div>

      <!-- Welcome text with event logo and main guy -->
      <div
        class="flex flex-row justify-around items-start lt-md:flex-col lt-md:justify-center lt-md:items-center pt-[50px]">
        <div class="flex-1 flex max-w-[23%] md:max-w-[30%] lt-md:justify-center lt-md:items-center ">
          <img src="{{introductionData.logoUrl}}" alt="Avatar" class="introduction-main-logo" />
        </div>
        <div class="flex-1">
          <div class="introduction-intro-text text-justify" *ngIf="introductionData.introductionText"
            [innerHTML]="introductionData.introductionText"></div>
          <summeet-introduction-people [isIntroduction]="true" [people]="introductionData.introductionPresidents"
            [title]="''"></summeet-introduction-people>
        </div>
      </div>



      <!-- Main themes -->
      <div *ngIf="introductionData.mainThemes" class="flex justify-center items-center pt-[40px]">
        <div>
          <h1 class="introduction-titles">Hlavné témy</h1>
        </div>
        <!-- <span class="introduction-background lt-md:text-center">Hlavné témy</span> -->
      </div>
      <div class="flex flex-row justify-center items-center lt-md:flex-col">
        <!-- <summeet-introduction-list-custom [data]="introductionData.mainThemes"></summeet-introduction-list-custom> -->
        <summeet-shared-list-custom [data]="introductionData.mainThemes"></summeet-shared-list-custom>
      </div>

      <!-- Conference presidents -->
      <summeet-introduction-people [people]="introductionData.conferencePresident"
        [title]="'Prezidenti podujatia'"></summeet-introduction-people>

      <!-- Honorary presidents -->
      <summeet-introduction-people [people]="introductionData.honoraryPresidents"
        [title]="'Čestní prezidenti'"></summeet-introduction-people>

      <!-- Hononary presidency -->
      <summeet-introduction-people [people]="introductionData.honoraryPresidency"
        [title]="'Čestné predsedníctvo'"></summeet-introduction-people>

      <!-- Organizing committee -->
      <summeet-introduction-people [people]="introductionData.organizingCommittee"
        [title]="'Organizačný výbor'"></summeet-introduction-people>
      <div *ngIf="!isMobile; else concatedOrganizatorCommittee"
        class="flex flex-row justify-evenly items-start mt-[16px] lt-md:flex-col lt-md:items-center">
        <summeet-introduction-list-custom [data]="organizingCommitteeNames1"></summeet-introduction-list-custom>
        <summeet-introduction-list-custom [data]="organizingCommitteeNames2"></summeet-introduction-list-custom>
      </div>
      <ng-template #concatedOrganizatorCommittee>
        <div class="flex flex-row justify-evenly items-start mt-[16px] lt-md:flex-col lt-md:items-center">
          <summeet-introduction-list-custom
            [data]="organizingCommitteeNames1.concat(organizingCommitteeNames2)"></summeet-introduction-list-custom>
        </div>
      </ng-template>

      <!-- Scientific committee -->
      <summeet-introduction-people [people]="introductionData.scientificCommittee"
        [title]="'Vedecký výbor'"></summeet-introduction-people>
      <div *ngIf="!isMobile; else concatedScientificCommittee"
        class="flex flex-row justify-evenly items-start mt-[16px] lt-md:flex-col lt-md:items-center">
        <summeet-introduction-list-custom [data]="scientificCommitteNames1"></summeet-introduction-list-custom>
        <summeet-introduction-list-custom [data]="scientificCommitteNames2"></summeet-introduction-list-custom>
      </div>
      <ng-template #concatedScientificCommittee>
        <div class="flex flex-row justify-evenly items-start mt-[16px] lt-md:flex-col lt-md:items-center">
          <summeet-introduction-list-custom
            [data]="scientificCommitteNames1.concat(scientificCommitteNames2)"></summeet-introduction-list-custom>
        </div>
      </ng-template>

      <!-- Event organizer -->
      <div *ngIf="introductionData.eventOrganizer" class="flex justify-center items-center pt-[40px]">
        <div>
          <h1 class="introduction-titles">Organizátor podujatia</h1>
        </div>
        <!-- <span class="introduction-background lt-md:text-center">Organizátor podujatia</span> -->
      </div>
      <div class="flex flex-col justify-center items-center ml-[5%]">
        <div class="flex flex-row justify-center items-center lt-md:flex-col">
          <div *ngIf="introductionData.eventOrganizer?.imgsrc"
            class="flex flex-1 max-w-[25%] justify-center items-center lt-md:mt-[40px]">
            <img src={{introductionData.eventOrganizer?.imgsrc}} class="hematolife-image" alt="hematolife-image" />
          </div>
          <div class="flex-1 lt-md:mt-[40px]">
            <p class="text-sm" [innerHTML]="introductionData.eventOrganizer?.text">
            </p>
          </div>
        </div>
      </div>

      <!-- Event co-organizer -->
      <div *ngIf="introductionData.eventCoOrganizer" class="flex justify-center items-center pt-[40px]">
        <div>
          <h1 class="introduction-titles">Spoluorganizátor podujatia</h1>
        </div>
        <!-- <span class="introduction-big-background lt-md:text-center">Spoluorganizátor podujatia</span> -->
      </div>
      <div class="flex flex-col ml-[5%]">
        <div class="flex flex-row justify-center items-start lt-md:flex-col lt-md:items-center">
          <div class="flex flex-1 max-w-[25%] justify-center items-center">
            <img src={{introductionData.eventCoOrganizer?.imgsrc}} class="introduction-co-organizator-logo"
              alt="hematolife-image" />
          </div>
          <div class="flex-1">
            <p class="text-sm" [innerHTML]="introductionData.eventCoOrganizer?.text">
            </p>
          </div>
        </div>
      </div>

      <!-- Under the auspices -->
      <div *ngIf="introductionData.underTheAuspices" class="flex justify-center items-center pt-[40px]">
        <div>
          <h1 class="introduction-titles">Pod záštitou</h1>
        </div>
        <!-- <span class="introduction-background lt-md:text-center">Pod záštitou</span> -->
      </div>
      <div class="flex flex-col justify-center items-center">
        <summeet-introduction-list-custom [data]="introductionData.underTheAuspices"></summeet-introduction-list-custom>
      </div>
    </div>
  </div>
</div>
