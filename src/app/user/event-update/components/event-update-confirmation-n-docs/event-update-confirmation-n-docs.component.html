<div class="flex flex-col justify-center items-center gap-[16px]">
  <h2 class="font-medium">Potvrdenia a dokumenty</h2>
  <p class="text-xs text-center m-0">
    Tu si môžete stiahnuť potvrdenie o účasti, šablóny a zmluvy, hneď ako budú dostupné.
  </p>

  <div class="max-w-[1000px] w-[85%] mb-[32px]">
    <table mat-table [dataSource]="dataSource"
      class="event-update-confirmation-n-docs-table pl-[16px] pr-[16px] mt-[32px]">

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
          <span class="flex flex-row justify-start items-center">
            <span>Názov dokumentu</span>
          </span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span class="flex flex-row justify-start items-center">{{ element.name }}</span>
        </td>
      </ng-container>

      <!-- State Column -->
      <ng-container matColumnDef="state">
        <th mat-header-cell *matHeaderCellDef>
          <span class="flex flex-col justify-center items-center">
            <span>Stav</span>
          </span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span class="flex justify-center items-center text-center">
            <span *ngIf="element.state === 'available'"
              class="my-events-absolved !rounded p-[3px] px-[14px]">Dostupné</span>
            <span *ngIf="element.state === 'in_progress'" class="my-events-upcmoning !rounded  p-[3px]">Pripravuje
              sa</span>
          </span>
        </td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>
          <span class="flex flex-col justify-center items-center">
            <span>Typ</span>
            <span>súboru</span>
          </span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span class="flex flex-row justify-center items-center">
            <span *ngIf="element.type === 'template'">šablóna</span>
            <span *ngIf="element.type === 'contract'">zmluva</span>
            <span *ngIf="element.type === 'endorsment'">potvrdenie</span>
          </span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <span class="flex justify-center"> Možnosti </span>
        </th>
        <td mat-cell *matCellDef="let element">
          <div class="flex flex-row justify-center items-center">
            <button mat-icon-button *ngIf="element.state === 'available'">
              <mat-icon>download</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
